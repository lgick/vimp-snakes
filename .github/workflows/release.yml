name: Release

# Publish via OIDC Trusted Publishing (no npm token stored). Local prep —
# bump `version` in package.json, write the changelog entry,
# `cargo update -p vimp-engine-core` / `npm i -D vimp-engine@^X` if the
# engine moved, commit, tag, push — is still done by `npm run release` in
# the engine repo (or by hand). This workflow does not create the tag — it
# runs FROM one: the tag push (`vX.Y.Z`) is what triggers it. It only builds
# the WASM core + dist/ (not committed) and publishes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      # GITHUB_ENV, not an ${{ }} expression inside run: — a tag name is
      # attacker-shaped text, and an expression is pasted into the script
      # before bash parses it
      - name: Read version
        run: echo "VERSION=${GITHUB_REF_NAME##v}" >> "$GITHUB_ENV"

      # The tag triggers this run, but npm publishes the version in the
      # file: a tag on a commit carrying another version would publish that
      # one, or fail on a confusing "cannot publish over". Checked before any
      # install — a wrong tag should cost nothing.
      - name: Verify tag matches package version
        run: |
          file=$(jq -r .version package.json)
          if [ "$file" != "$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME, but package.json says $file" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Setup Rust (vimp-snakes-core)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        run: npm ci

      # Trusted Publishing needs npm >= 11.5.1; older npm silently falls back
      # to the legacy token flow and the publish fails with ENEEDAUTH
      - name: Update npm
        run: npm install -g npm@latest

      - name: Guard against re-publish
        run: |
          set -e
          published=$(npm view "@vimp-games/snakes@$VERSION" version 2>/dev/null || true)
          if [ -n "$published" ]; then
            echo "@vimp-games/snakes@$VERSION is already on npm" >&2
            exit 1
          fi

      - name: Build core (web + nodejs)
        run: npm run core:build

      - name: Build plugin (dist/ + manifest)
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance
